name: Offline regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and CLI entry points
        run: python -m pip install -e .
      - name: Run all regression tests with networking blocked
        run: python scripts/run-tests.py
      - name: Validate fictional catalog through installed CLI
        run: woo-sync validate data/catalog.json
      - name: Check whitespace
        run: git diff --check
