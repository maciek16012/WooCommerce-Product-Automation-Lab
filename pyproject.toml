[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "woo-product-automation-lab"
version = "1.3.0"
description = "Validated multi-source WooCommerce synchronization and reviewed AI content"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
woo-sync = "woo_sync.cli:main"
woo-ai = "woo_sync.ai_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
