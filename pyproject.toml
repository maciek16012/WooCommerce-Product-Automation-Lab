[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "woo-product-automation-lab"
version = "0.1.0"
description = "Idempotent CSV to WooCommerce product synchronization"
requires-python = ">=3.10"

[project.scripts]
woo-sync = "woo_sync.cli:main"
woo-ai = "woo_sync.ai_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
